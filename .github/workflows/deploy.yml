name: Deploy to production

# Runs on every push to main — pulls the new code on the VPS and rebuilds
# the Docker Compose stack there. Requires these repo secrets to be set
# (Settings → Secrets and variables → Actions):
#   SSH_HOST          202.155.16.39
#   SSH_USER          deploy
#   SSH_PRIVATE_KEY   private half of the deploy keypair (see docs/DEPLOY.md)
#   SSH_PORT          optional, defaults to 22 if unset
on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a redeploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /opt/rizal-heritage
            git fetch origin main
            git reset --hard origin/main
            docker compose build
            docker compose up -d
            docker image prune -f
